schema_version: 1
graph: {name: bench_immediate_chain, kind: runnable}
lanes: {main: {type: event_loop}}
components:
  - id: source
    type: topoexec.boundary.Input
    event_sources: [{type: manual}]
    trigger_policy: {type: manual}
    execution: {lane: main}
  - id: transform_a
    type: topoexec.transforms.Identity
    event_sources: [{type: message, inputs: [in]}]
    trigger_policy: {type: any_input, inputs: [in]}
    execution: {lane: main}
  - id: transform_b
    type: topoexec.transforms.Identity
    event_sources: [{type: message, inputs: [in]}]
    trigger_policy: {type: any_input, inputs: [in]}
    execution: {lane: main}
  - id: sink
    type: topoexec.boundary.Output
    event_sources: [{type: message, inputs: [in]}]
    trigger_policy: {type: any_input, inputs: [in]}
    execution: {lane: main}
edges:
  - {id: source_a, kind: immediate, from: source.out, to: transform_a.in, policy: {mode: latest, copy_policy: shared_view}}
  - {id: a_b, kind: immediate, from: transform_a.out, to: transform_b.in, policy: {mode: latest, copy_policy: shared_view}}
  - {id: b_sink, kind: immediate, from: transform_b.out, to: sink.in, policy: {mode: latest, copy_policy: shared_view}}
