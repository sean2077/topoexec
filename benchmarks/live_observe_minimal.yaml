schema_version: 1
graph: {name: live_observe_minimal, kind: runnable}
lanes: {main: {type: event_loop}}
components:
  - id: source
    type: topoexec.boundary.Input
    event_sources: [{type: manual}]
    trigger_policy: {type: manual}
    execution: {lane: main}
  - id: transform
    type: topoexec.transforms.Identity
    event_sources: [{type: message, inputs: [in]}]
    trigger_policy: {type: any_input, inputs: [in]}
    execution: {lane: main}
  - id: sink
    type: topoexec.boundary.Output
    event_sources: [{type: message, inputs: [in]}]
    trigger_policy: {type: any_input, inputs: [in]}
    execution: {lane: main}
edges:
  - {id: source_transform, kind: immediate, from: source.out, to: transform.in, policy: {mode: queue, capacity: 16, overflow: drop_oldest, copy_policy: shared_view}}
  - {id: transform_sink, kind: immediate, from: transform.out, to: sink.in, policy: {mode: latest, copy_policy: shared_view}}
