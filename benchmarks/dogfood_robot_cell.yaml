schema_version: 1
graph:
  name: dogfood_robot_cell
  kind: runnable
  config: {pilot: synthetic, release_gate: g76}
lanes:
  main: {type: event_loop}
components:
  - id: camera_event
    type: topoexec.boundary.Input
    boundary: {role: input, descriptor: synthetic-camera-frame}
    event_sources: [{type: manual}]
    trigger_policy: {type: manual}
    execution: {lane: main}
  - id: force_event
    type: topoexec.boundary.Input
    boundary: {role: input, descriptor: synthetic-force-sample}
    event_sources: [{type: manual}]
    trigger_policy: {type: manual}
    execution: {lane: main}
  - id: fusion
    type: topoexec.transforms.Join
    event_sources: [{type: message, inputs: [left, right]}]
    trigger_policy: {type: time_sync, inputs: [left, right], sync_slop_ms: 5}
    execution: {lane: main}
  - id: estimator
    type: topoexec.example.Estimator
    event_sources: [{type: message, inputs: [sensor, correction]}]
    trigger_policy: {type: any_input, inputs: [sensor, correction]}
    execution: {lane: main}
  - id: planner_worker
    type: topoexec.transforms.AsyncWorker
    event_sources: [{type: task_ready, inputs: [ready]}]
    trigger_policy: {type: task_ready, inputs: [ready]}
    execution: {lane: main}
  - id: controller
    type: topoexec.example.Controller
    event_sources: [{type: message, inputs: [estimate]}]
    trigger_policy: {type: any_input, inputs: [estimate]}
    execution: {lane: main}
  - id: actuator
    type: topoexec.example.Actuator
    boundary: {role: output, descriptor: synthetic-actuator-command}
    event_sources: [{type: message, inputs: [command]}]
    trigger_policy: {type: any_input, inputs: [command]}
    execution: {lane: main}
  - id: audit_log
    type: topoexec.boundary.Output
    boundary: {role: output, descriptor: synthetic-audit-state}
    event_sources: [{type: message, inputs: [in]}]
    trigger_policy: {type: any_input, inputs: [in]}
    execution: {lane: main}
edges:
  - {id: camera_to_fusion, kind: immediate, from: camera_event.out, to: fusion.left, policy: {mode: queue, capacity: 8, overflow: drop_oldest, timestamp_domain: steady, copy_policy: shared_view}}
  - {id: force_to_fusion, kind: immediate, from: force_event.out, to: fusion.right, policy: {mode: queue, capacity: 8, overflow: drop_oldest, timestamp_domain: steady, copy_policy: shared_view}}
  - {id: fusion_to_estimator, kind: immediate, from: fusion.out, to: estimator.sensor, policy: {mode: latest, copy_policy: shared_view}}
  - {id: estimator_to_planner, kind: async, from: estimator.estimate, to: planner_worker.ready, policy: {mode: queue, capacity: 4, max_inflight: 2, overflow: drop_oldest, copy_policy: shared_view}}
  - {id: planner_to_controller, kind: immediate, from: planner_worker.out, to: controller.estimate, policy: {mode: latest, copy_policy: shared_view}}
  - {id: controller_to_actuator, kind: immediate, from: controller.command, to: actuator.command, policy: {mode: latest, copy_policy: shared_view}}
  - {id: controller_to_estimator_delay, kind: delay, from: controller.correction, to: estimator.correction, policy: {mode: queue, capacity: 4, overflow: drop_oldest, copy_policy: shared_view}}
  - {id: controller_to_audit_state, kind: state, from: controller.correction, to: audit_log.in, policy: {mode: latest, copy_policy: shared_view}}
