schema_version: 1
graph:
  name: large_payload_copy
  kind: runnable
lanes:
  main:
    type: event_loop
components:
  - id: camera
    type: topoexec.boundary.FrameInput
    event_sources:
      - {type: manual}
    trigger_policy:
      type: manual
    execution:
      lane: main
  - id: sink
    type: topoexec.boundary.Output
    event_sources:
      - {type: message, inputs: [in]}
    trigger_policy:
      type: any_input
      inputs: [in]
    execution:
      lane: main
edges:
  - id: camera_to_sink
    kind: immediate
    from: camera.out
    to: sink.in
    policy:
      mode: latest
      capacity: 1
      overflow: overwrite
      copy_policy: copy
