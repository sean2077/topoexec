schema_version: 1
graph: {name: batch_time_sync, kind: runnable}
lanes: {main: {type: event_loop}}
components:
  - id: left_sensor
    type: topoexec.boundary.Input
    boundary: {role: input, descriptor: left-sensor}
    event_sources: [{type: manual}]
    trigger_policy: {type: manual}
    execution: {lane: main}
  - id: right_sensor
    type: topoexec.boundary.Input
    boundary: {role: input, descriptor: right-sensor}
    event_sources: [{type: manual}]
    trigger_policy: {type: manual}
    execution: {lane: main}
  - id: sync_join
    type: topoexec.transforms.Join
    event_sources: [{type: message, inputs: [left, right]}]
    trigger_policy: {type: time_sync, inputs: [left, right], sync_slop_ms: 5}
    execution: {lane: main}
  - id: sink
    type: topoexec.boundary.Output
    boundary: {role: output, descriptor: synced-output}
    event_sources: [{type: message, inputs: [in]}]
    trigger_policy: {type: any_input, inputs: [in]}
    execution: {lane: main}
edges:
  - {id: left_join, kind: immediate, from: left_sensor.out, to: sync_join.left, policy: {mode: queue, capacity: 8, overflow: drop_oldest, timestamp_domain: steady, copy_policy: shared_view}}
  - {id: right_join, kind: immediate, from: right_sensor.out, to: sync_join.right, policy: {mode: queue, capacity: 8, overflow: drop_oldest, timestamp_domain: steady, copy_policy: shared_view}}
  - {id: join_sink, kind: immediate, from: sync_join.out, to: sink.in, policy: {mode: latest, copy_policy: shared_view}}
