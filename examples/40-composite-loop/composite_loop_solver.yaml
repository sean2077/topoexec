schema_version: 1
graph:
  name: composite_loop_solver
  kind: runnable
lanes:
  main: {type: event_loop}
components:
  - id: sensor
    type: topoexec.example.Sensor
    boundary: {role: input, descriptor: synthetic-sensor}
    event_sources: [{type: manual}]
    trigger_policy: {type: manual}
    execution: {lane: main}
  - id: estimator
    type: topoexec.example.Estimator
    event_sources: [{type: message, inputs: [sensor, correction]}]
    trigger_policy: {type: any_input, inputs: [sensor, correction]}
    execution: {lane: main}
  - id: controller
    type: topoexec.example.Controller
    event_sources: [{type: message, inputs: [estimate]}]
    trigger_policy: {type: any_input, inputs: [estimate]}
    execution: {lane: main}
  - id: actuator
    type: topoexec.example.Actuator
    boundary: {role: output, descriptor: synthetic-actuator}
    event_sources: [{type: message, inputs: [command]}]
    trigger_policy: {type: any_input, inputs: [command]}
    execution: {lane: main}
edges:
  - {id: sensor_to_estimator, kind: immediate, from: sensor.out, to: estimator.sensor, policy: {mode: latest, copy_policy: shared_view}}
  - {id: estimator_to_controller, kind: immediate, from: estimator.estimate, to: controller.estimate, policy: {mode: latest, copy_policy: shared_view}}
  - {id: controller_correction, kind: immediate, from: controller.correction, to: estimator.correction, policy: {mode: latest, copy_policy: shared_view}}
  - {id: controller_to_actuator, kind: delay, from: controller.command, to: actuator.command, policy: {mode: queue, capacity: 2, overflow: drop_oldest, copy_policy: shared_view}}
composite_loops:
  - id: estimator_controller_loop
    components: [estimator, controller]
    loop_policy:
      type: fixed_point
      # Generous wall-clock safety budget: the loop normally stops at max_iterations/convergence well within
      # 1ms, so this only caps a pathologically slow loop. A tight budget made golden runtime metrics flaky
      # under instrumented (sanitizer) parallel test load, where an iteration could exceed a few milliseconds.
      budget_ms: 1000
      max_iterations: 3
      convergence: stable_state
