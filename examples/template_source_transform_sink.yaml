schema_version: 1
graph:
  name: template_source_transform_sink
  kind: internal_test
lanes:
  main:
    type: event_loop
components: []
edges: []
templates:
  - id: source_transform_sink
    parameters: [source_descriptor, sink_descriptor]
    components:
      - id: source
        type: topoexec.boundary.Input
        boundary: {role: input, descriptor: "{{source_descriptor}}"}
        event_sources: [{type: manual}]
        trigger_policy: {type: manual}
        execution: {lane: main}
      - id: transform
        type: topoexec.transforms.Identity
        event_sources: [{type: message, inputs: [in]}]
        trigger_policy: {type: any_input, inputs: [in]}
        execution: {lane: main}
      - id: sink
        type: topoexec.boundary.Output
        boundary: {role: output, descriptor: "{{sink_descriptor}}"}
        event_sources: [{type: message, inputs: [in]}]
        trigger_policy: {type: any_input, inputs: [in]}
        execution: {lane: main}
    edges:
      - id: source_transform
        kind: immediate
        from: source.out
        to: transform.in
        policy: {mode: queue, capacity: 4, overflow: drop_oldest, copy_policy: shared_view}
      - id: transform_sink
        kind: immediate
        from: transform.out
        to: sink.in
        policy: {mode: latest, copy_policy: shared_view}
template_instances:
  - id: demo
    template: source_transform_sink
    parameters:
      source_descriptor: stdin
      sink_descriptor: stdout
