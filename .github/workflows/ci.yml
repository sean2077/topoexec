name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CLANG_FORMAT: clang-format-22
  CLANG_TIDY: clang-tidy-22

jobs:
  pr-fast-check:
    name: PR fast check
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ca-certificates gnupg wget
          . /etc/os-release
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc >/dev/null
          echo "deb http://apt.llvm.org/${VERSION_CODENAME}/ llvm-toolchain-${VERSION_CODENAME}-22 main" | sudo tee /etc/apt/sources.list.d/llvm-toolchain-22.list
          sudo apt-get update
          sudo apt-get install -y \
            clang-format-22 \
            cmake \
            g++ \
            libcli11-dev \
            libyaml-cpp-dev \
            ninja-build \
            nlohmann-json3-dev \
            pkg-config

      - name: Configure, build, and run PR smoke tests
        env:
          CXX: g++
          TOPOEXEC_BUILD_DIR: build-pr-fast
        run: ./scripts/ci_pr_check.sh

  build-test:
    name: ${{ matrix.compiler }} / ${{ matrix.build_type }}
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - compiler: gcc
            cxx: g++
            build_type: Debug
          - compiler: gcc
            cxx: g++
            build_type: RelWithDebInfo
          - compiler: clang
            cxx: clang++
            build_type: Debug
          - compiler: clang
            cxx: clang++
            build_type: RelWithDebInfo

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ca-certificates gnupg wget
          . /etc/os-release
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc >/dev/null
          echo "deb http://apt.llvm.org/${VERSION_CODENAME}/ llvm-toolchain-${VERSION_CODENAME}-22 main" | sudo tee /etc/apt/sources.list.d/llvm-toolchain-22.list
          sudo apt-get update
          sudo apt-get install -y \
            clang \
            clang-format-22 \
            clang-tidy-22 \
            cmake \
            g++ \
            libcli11-dev \
            libyaml-cpp-dev \
            ninja-build \
            nlohmann-json3-dev \
            pkg-config

      - name: Configure, build, and test
        env:
          CXX: ${{ matrix.cxx }}
          TOPOEXEC_BUILD_DIR: build-${{ matrix.compiler }}-${{ matrix.build_type }}
          TOPOEXEC_BUILD_TYPE: ${{ matrix.build_type }}
        run: ./scripts/agent_check.sh

  preview-options:
    name: Preview option smoke / ${{ matrix.mode }}
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mode: [adapters, ffi, python, plugins]

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ca-certificates gnupg wget
          . /etc/os-release
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc >/dev/null
          echo "deb http://apt.llvm.org/${VERSION_CODENAME}/ llvm-toolchain-${VERSION_CODENAME}-22 main" | sudo tee /etc/apt/sources.list.d/llvm-toolchain-22.list
          sudo apt-get update
          sudo apt-get install -y \
            clang-format-22 \
            clang-tidy-22 \
            cmake \
            g++ \
            libcli11-dev \
            libyaml-cpp-dev \
            ninja-build \
            nlohmann-json3-dev \
            pkg-config

      - name: Build and smoke selected preview surface
        env:
          TOPOEXEC_BUILD_DIR: build-preview-${{ matrix.mode }}
        run: ./scripts/goal_check.sh ${{ matrix.mode }}

  thread-sanitizer:
    name: clang / Debug / TSAN
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ca-certificates gnupg wget
          . /etc/os-release
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc >/dev/null
          echo "deb http://apt.llvm.org/${VERSION_CODENAME}/ llvm-toolchain-${VERSION_CODENAME}-22 main" | sudo tee /etc/apt/sources.list.d/llvm-toolchain-22.list
          sudo apt-get update
          sudo apt-get install -y \
            clang \
            clang-format-22 \
            clang-tidy-22 \
            cmake \
            libcli11-dev \
            libyaml-cpp-dev \
            ninja-build \
            nlohmann-json3-dev \
            pkg-config

      - name: Configure, build, and test with ThreadSanitizer
        env:
          CXX: clang++
          TOPOEXEC_BUILD_DIR: build-clang-debug-tsan
          TOPOEXEC_BUILD_TYPE: Debug
          TOPOEXEC_SANITIZER_MODE: thread
        run: ./scripts/sanitizer_check.sh

  address-undefined-sanitizer:
    name: clang / Debug / ASAN+UBSAN
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ca-certificates gnupg wget
          . /etc/os-release
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc >/dev/null
          echo "deb http://apt.llvm.org/${VERSION_CODENAME}/ llvm-toolchain-${VERSION_CODENAME}-22 main" | sudo tee /etc/apt/sources.list.d/llvm-toolchain-22.list
          sudo apt-get update
          sudo apt-get install -y \
            clang \
            clang-format-22 \
            clang-tidy-22 \
            cmake \
            libcli11-dev \
            libyaml-cpp-dev \
            ninja-build \
            nlohmann-json3-dev \
            pkg-config

      - name: Configure, build, and test with AddressSanitizer and UBSan
        env:
          CXX: clang++
          TOPOEXEC_BUILD_DIR: build-clang-debug-asan-ubsan
          TOPOEXEC_BUILD_TYPE: Debug
          TOPOEXEC_SANITIZER_MODE: address-undefined
        run: ./scripts/sanitizer_check.sh

  fuzz-smoke:
    name: clang / libFuzzer smoke
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ca-certificates gnupg wget
          . /etc/os-release
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc >/dev/null
          echo "deb http://apt.llvm.org/${VERSION_CODENAME}/ llvm-toolchain-${VERSION_CODENAME}-22 main" | sudo tee /etc/apt/sources.list.d/llvm-toolchain-22.list
          sudo apt-get update
          sudo apt-get install -y \
            clang \
            clang-format-22 \
            clang-tidy-22 \
            cmake \
            libcli11-dev \
            libyaml-cpp-dev \
            ninja-build \
            nlohmann-json3-dev \
            pkg-config

      - name: Build and run short libFuzzer corpus smoke
        env:
          CXX: clang++
          TOPOEXEC_FUZZER_ENGINE: LIBFUZZER
          TOPOEXEC_FUZZ_BUILD_DIR: build-clang-fuzz
        run: ./scripts/fuzz_smoke.sh
