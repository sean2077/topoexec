name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    name: ${{ matrix.compiler }} / ${{ matrix.build_type }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - compiler: gcc
            cxx: g++
            build_type: Debug
          - compiler: gcc
            cxx: g++
            build_type: RelWithDebInfo
          - compiler: clang
            cxx: clang++
            build_type: Debug
          - compiler: clang
            cxx: clang++
            build_type: RelWithDebInfo

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang \
            clang-format \
            clang-tidy \
            cmake \
            g++ \
            libcli11-dev \
            libyaml-cpp-dev \
            ninja-build \
            nlohmann-json3-dev \
            pkg-config

      - name: Configure, build, and test
        env:
          CXX: ${{ matrix.cxx }}
          TOPOEXEC_BUILD_DIR: build-${{ matrix.compiler }}-${{ matrix.build_type }}
          TOPOEXEC_BUILD_TYPE: ${{ matrix.build_type }}
        run: ./scripts/agent_check.sh

  preview-options:
    name: Preview option smoke / ${{ matrix.mode }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mode: [adapters, ffi, python, plugins]

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang-format \
            clang-tidy \
            cmake \
            g++ \
            libcli11-dev \
            libyaml-cpp-dev \
            ninja-build \
            nlohmann-json3-dev \
            pkg-config

      - name: Build and smoke selected preview surface
        env:
          TOPOEXEC_BUILD_DIR: build-preview-${{ matrix.mode }}
        run: ./scripts/goal_check.sh ${{ matrix.mode }}

  thread-sanitizer:
    name: clang / Debug / TSAN
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang \
            clang-format \
            clang-tidy \
            cmake \
            libcli11-dev \
            libyaml-cpp-dev \
            ninja-build \
            nlohmann-json3-dev \
            pkg-config

      - name: Configure, build, and test with ThreadSanitizer
        env:
          CXX: clang++
          TOPOEXEC_BUILD_DIR: build-clang-debug-tsan
          TOPOEXEC_BUILD_TYPE: Debug
          TOPOEXEC_SANITIZER_MODE: thread
        run: ./scripts/sanitizer_check.sh

  address-undefined-sanitizer:
    name: clang / Debug / ASAN+UBSAN
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang \
            clang-format \
            clang-tidy \
            cmake \
            libcli11-dev \
            libyaml-cpp-dev \
            ninja-build \
            nlohmann-json3-dev \
            pkg-config

      - name: Configure, build, and test with AddressSanitizer and UBSan
        env:
          CXX: clang++
          TOPOEXEC_BUILD_DIR: build-clang-debug-asan-ubsan
          TOPOEXEC_BUILD_TYPE: Debug
          TOPOEXEC_SANITIZER_MODE: address-undefined
        run: ./scripts/sanitizer_check.sh

  fuzz-smoke:
    name: clang / libFuzzer smoke
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang \
            clang-format \
            clang-tidy \
            cmake \
            libcli11-dev \
            libyaml-cpp-dev \
            ninja-build \
            nlohmann-json3-dev \
            pkg-config

      - name: Build and run short libFuzzer corpus smoke
        env:
          CXX: clang++
          TOPOEXEC_FUZZER_ENGINE: LIBFUZZER
          TOPOEXEC_FUZZ_BUILD_DIR: build-clang-fuzz
        run: ./scripts/fuzz_smoke.sh
